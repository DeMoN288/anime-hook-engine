[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anime-hook"
version = "0.1.0"
description = "Async bilingual anime hook and emotional climax intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.27,<1", "pydantic>=2.7,<3", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8"]

[project.scripts]
anime-hook = "anime_hook.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
