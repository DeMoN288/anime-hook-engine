[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anime-hook"
version = "1.1.0"
description = "Async bilingual anime hook velocity & emotional climax intelligence engine with MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27,<1",
    "pydantic>=2.7,<3",
    "rich>=13,<15",
    "mcp>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8"]

[project.scripts]
anime-hook = "anime_hook.cli:main"
anime-hook-mcp = "anime_hook.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
